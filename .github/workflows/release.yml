name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            deps: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            suffix: linux-arm64
            deps: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libgl1-mesa-dev xorg-dev
            cc: aarch64-linux-gnu-gcc
            cgo_enabled: "1"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.deps }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo_enabled || '1' }}
          CC: ${{ matrix.cc || 'gcc' }}
        run: go build -o timew-overlay-${{ matrix.suffix }} .

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} timew-overlay-${{ matrix.suffix }}
